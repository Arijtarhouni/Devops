server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy vers le backend Spring Boot (le préfixe /api/ est retiré)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular Router : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets statiques buildés
    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg|jpeg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
